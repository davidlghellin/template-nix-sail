name: test

on:
  push:
    branches: [master]
  pull_request:

# Un push nuevo a la misma rama deja obsoleta la ejecucion anterior.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Va primero por dos motivos: es lo mas barato en fallar, y construye el venv
  # que reutilizan los tests. Los tres jobs abren el mismo `nix develop`, y
  # SPARK_BACKEND solo decide contra que motor corren, no que se instala: el
  # venv es identico y basta una clave de cache para todos.
  # La clave incluye flake.nix y flake.lock: el venv apunta al Python que elige
  # el flake, y si cambia hay que guardar uno nuevo en vez de reconstruirlo en
  # cada ejecucion.
  checks:
    runs-on: ubuntu-latest
    name: lint + typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache@v4
        with:
          path: .venv-nix
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'flake.nix', 'flake.lock') }}
      - run: nix develop --command ruff check .
      - run: nix develop --command ruff format --check .
      - run: nix develop --command mypy etl_kedro tests

  # Solo si lint y tipos pasan: no merece la pena arrancar dos motores de Spark
  # para un import mal ordenado. Para entonces la cache ya esta guardada.
  test:
    needs: checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [pysail, pyspark]
    name: test (${{ matrix.backend }})
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v30
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: actions/cache/restore@v4
        with:
          path: .venv-nix
          key: venv-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'flake.nix', 'flake.lock') }}
      - run: nix develop --command pytest -v
        env:
          SPARK_BACKEND: ${{ matrix.backend }}
