[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["devel0pez*", "etl_kedro*"]

[project]
name = "dev-nix-sail"
version = "0.1.0"
description = "Nix template for PySpark/PySail projects"
requires-python = ">=3.10,<3.15"
dependencies = [
    "pysail==0.7.0",
    # Pin the exact PySpark version, as the Sail docs recommend. Since 0.7.0
    # Sail ships one Spark config per version and picks it from the client
    # version, so 3.5 and 4.0/4.1 work too; we track the newest supported.
    "pyspark[connect]==4.2.0",
    # Transitive dependency of pyspark[connect], pinned because PySpark warns
    # it does not fully support pandas >= 3 yet.
    "pandas<3",
]

[project.scripts]
dev-nix-sail = "devel0pez.main:main"
etl-kedro = "etl_kedro.main:main"

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff==0.16.0",
    "hatch>=1.14",
    "build>=1.0",
]

# Los scripts de hatch envuelven las mismas herramientas que ya trae el shell de
# Nix, para poder lanzarlas igual fuera de el (`hatch run test|typecheck|lint`).
[tool.hatch.envs.default]
features = ["dev"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:-v}"
test-cov = "pytest --cov=etl_kedro --cov-report=term-missing {args:-v}"
typecheck = "mypy {args:etl_kedro tests}"
lint = "ruff check {args:.}"

[tool.mypy]
# Sin `python_version`: se analiza con la version del interprete activo. Fijarlo
# a 3.10 rompe al leer los stubs de numpy, que usan sintaxis de 3.12.
files = ["etl_kedro", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

# Las funciones de la ETL van tipadas; los tests usan fixtures de pytest sin
# anotar, asi que solo se les exige que el cuerpo cuadre.
[[tool.mypy.overrides]]
module = "etl_kedro.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "pysail.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "--durations=0"
markers = [
    "unit: unit tests without external dependencies",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.isort]
known-first-party = ["devel0pez", "etl_kedro"]
